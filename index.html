const $ = id => document.getElementById(id);

const escapeHTML = value =>
  String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));

const money = kobo =>
  "₦" + (Number(kobo || 0) / 100).toLocaleString("en-NG", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

function setStatus(id, message, type = "") {
  const element = $(id);
  if (!element) return;

  element.textContent = message;
  element.className = "status " + type;
}

function initializeSupabase() {
  if (!window.supabase?.createClient) {
    setStatus(
      "authMessage",
      "Supabase failed to load. Check your internet and refresh.",
      "error"
    );
    return;
  }

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    currentUser = session?.user || null;
    updateAccountUI();

    if (currentUser) {
      refreshWallet();

      if (pendingPaymentReference) {
        verifyReturnedPayment();
      }
    } else {
      resetWalletUI();
    }
  });

  supabaseClient.auth.getSession().then(({ data, error }) => {
    if (error) {
      setStatus("authMessage", error.message, "error");
      return;
    }

    currentUser = data.session?.user || null;
    updateAccountUI();

    if (currentUser) {
      refreshWallet();

      if (pendingPaymentReference) {
        verifyReturnedPayment();
      }
    }
  });
}

function updateAccountUI() {
  if (!$("accountButton")) return;

  $("accountButton").textContent =
    currentUser ? "My Account" : "Log In";

  $("signupButton").textContent =
    currentUser ? "Account" : "Sign Up ↗";

  $("accountSection").classList.toggle("hidden", !currentUser);

  if (currentUser) {
    $("signedInEmail").textContent = currentUser.email || "Signed in";

    $("accountButton").onclick = () => {
      $("accountSection").classList.remove("hidden");
      $("accountSection").scrollIntoView({ behavior: "smooth" });
    };

    $("signupButton").onclick = () => {
      $("accountSection").classList.remove("hidden");
      $("accountSection").scrollIntoView({ behavior: "smooth" });
    };
  } else {
    $("accountButton").onclick = () => openAuth("login");
    $("signupButton").onclick = () => openAuth("signup");
  }
}

function resetWalletUI() {
  $("walletBalance").textContent = "Sign in to view";
  $("walletAccountState").textContent =
    "Your wallet is linked to your GameVault account.";

  $("walletTransactions").innerHTML =
    '<p class="muted">Sign in to view your transaction history.</p>';
}

function openAuth(mode) {
  $("authModal").classList.add("open");
  document.body.classList.add("modal-open");
  setAuthMode(mode);
}

function closeAuth() {
  $("authModal").classList.remove("open");
  document.body.classList.remove("modal-open");
}

function setAuthMode(mode) {
  authMode = mode === "signup" ? "signup" : "login";

  const signup = authMode === "signup";

  $("authTitle").textContent = signup
    ? "Create your GameVault account"
    : "Welcome back!";

  $("authSubmit").textContent = signup
    ? "Create Account"
    : "Log In";

  $("loginTab").classList.toggle("inactive", signup);
  $("signupTab").classList.toggle("inactive", !signup);

  $("authPassword").autocomplete =
    signup ? "new-password" : "current-password";

  setStatus("authMessage", "");
}

/* Add a password-reset option without changing the page layout. */
function addPasswordResetOption() {
  if ($("forgotPasswordButton")) return;

  const button = document.createElement("button");
  button.id = "forgotPasswordButton";
  button.type = "button";
  button.className = "ghost";
  button.textContent = "Forgot password?";
  button.style.width = "100%";
  button.style.marginTop = "10px";

  button.onclick = resetPassword;

  $("authForm").appendChild(button);
}

async function resetPassword() {
  if (!supabaseClient) {
    return setStatus("authMessage", "Supabase is not ready.", "error");
  }

  const email = $("authEmail").value.trim();

  if (!email) {
    return setStatus(
      "authMessage",
      "Enter your email address first.",
      "error"
    );
  }

  setStatus("authMessage", "Requesting password reset...");

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://gamevault-hub.github.io/gamevault-site/"
  });

  if (error) {
    setStatus("authMessage", error.message, "error");
    return;
  }

  setStatus(
    "authMessage",
    "If the reset request was accepted, check your email for instructions.",
    "success"
  );
}

/* FIXED: the signup/login conditional now uses the correct ternary syntax. */
$("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!supabaseClient) {
    return setStatus(
      "authMessage",
      "Supabase is not ready. Refresh and try again.",
      "error"
    );
  }

  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;

  $("authSubmit").disabled = true;
  setStatus("authMessage", "Please wait...");

  try {
    const result = authMode === "signup"
      ? await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo:
              "https://gamevault-hub.github.io/gamevault-site/"
          }
        })
      : await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

    if (result.error) {
      setStatus("authMessage", result.error.message, "error");
      return;
    }

    if (authMode === "signup" && !result.data.session) {
      setStatus(
        "authMessage",
        "Account created. Confirm your email before logging in.",
        "success"
      );
      return;
    }

    currentUser =
      result.data.user || result.data.session?.user || null;

    updateAccountUI();
    closeAuth();

    if (currentUser) {
      await refreshWallet();

      if (pendingPaymentReference) {
        await verifyReturnedPayment();
      }
    }
  } catch (error) {
    setStatus(
      "authMessage",
      error.message || "Connection error. Please try again.",
      "error"
    );
  } finally {
    $("authSubmit").disabled = false;
  }
});

async function callFunction(name, payload) {
  if (!supabaseClient) {
    throw new Error("Supabase is not ready.");
  }

  const {
    data: { session },
    error
  } = await supabaseClient.auth.getSession();

  if (error || !session) {
    throw new Error("Please log in before continuing.");
  }

  const response = await fetch(
    `${SUPABASE_URL}/functions/v1/${name}`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": `Bearer ${session.access_token}`
      },
      body: JSON.stringify(payload)
    }
  );

  const result = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      result.error || "The request failed. Please try again."
    );
  }

  return result;
}

async function startWalletFunding() {
  if (!currentUser) {
    openAuth("login");
    setStatus("walletMessage", "Log in before funding your wallet.");
    return;
  }

  const amount = Number($("walletAmount").value);

  if (!Number.isSafeInteger(amount) || amount < 100 || amount > 500000) {
    return setStatus(
      "walletMessage",
      "Enter an amount from ₦100 to ₦500,000.",
      "error"
    );
  }

  $("walletFundButton").disabled = true;
  setStatus("walletMessage", "Preparing secure Paystack checkout...");

  try {
    const result = await callFunction(INIT_FUNCTION, {
      amount,
      callback_url:
        "https://gamevault-hub.github.io/gamevault-site/"
    });

    if (!result.authorization_url || !result.reference) {
      throw new Error("Checkout did not return a payment link.");
    }

    window.location.assign(result.authorization_url);
  } catch (error) {
    setStatus(
      "walletMessage",
      error.message || "Could not start checkout.",
      "error"
    );

    $("walletFundButton").disabled = false;
  }
}

async function verifyReturnedPayment() {
  if (verifyingPayment || !pendingPaymentReference) return;

  if (!currentUser) {
    setStatus(
      "walletMessage",
      "Log in to verify this payment against your account."
    );
    openAuth("login");
    return;
  }

  verifyingPayment = true;
  setStatus("walletMessage", "Checking your payment with Paystack...");

  try {
    const result = await callFunction(VERIFY_FUNCTION, {
      reference: pendingPaymentReference
    });

    if (result.credited) {
      setStatus(
        "walletMessage",
        "Payment verified and wallet credited.",
        "success"
      );
    } else if (result.alreadyCredited) {
      setStatus(
        "walletMessage",
        "This payment was already credited.",
        "success"
      );
    } else {
      setStatus(
        "walletMessage",
        result.message || "Payment not confirmed yet."
      );
    }

    pendingPaymentReference = null;

    history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    await refreshWallet();
  } catch (error) {
    setStatus(
      "walletMessage",
      error.message || "Could not verify payment. Try again.",
      "error"
    );
  } finally {
    verifyingPayment = false;
  }
}

async function refreshWallet() {
  if (!supabaseClient || !currentUser) {
    resetWalletUI();
    return;
  }

  $("walletBalance").textContent = "Loading...";

  try {
    const { data: wallet, error: walletError } =
      await supabaseClient
        .from("gv_wallets")
        .select("balance_kobo")
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (walletError) throw walletError;

    $("walletBalance").textContent = money(wallet?.balance_kobo || 0);
    $("walletAccountState").textContent = currentUser.email || "Signed in";

    const { data: transactions, error: txError } =
      await supabaseClient
        .from("gv_wallet_transactions")
        .select(
          "type,amount_kobo,status,description,created_at,reference"
        )
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false })
        .limit(20);

    if (txError) throw txError;

    $("walletTransactions").innerHTML = transactions?.length
      ? transactions.map(tx => `
          <div class="line">
            <span>
              <strong>${escapeHTML(tx.description || tx.type)}</strong><br>
              <small class="muted">
                ${escapeHTML(new Date(tx.created_at).toLocaleString())}
              </small><br>
              <small class="muted">${escapeHTML(tx.reference || "")}</small>
            </span>
            <span>
              ${money(tx.amount_kobo)}<br>
              <span class="badge">${escapeHTML(tx.status)}</span>
            </span>
          </div>
        `).join("")
      : '<p class="muted">No wallet transactions yet.</p>';
  } catch (error) {
    $("walletBalance").textContent = "Unavailable";

    $("walletTransactions").innerHTML =
      '<p class="muted">Could not load wallet information. Check database policies.</p>';
  }
}

async function signOut() {
  if (!supabaseClient) return;

  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert("Could not sign out. Please try again.");
    return;
  }

  currentUser = null;
  updateAccountUI();
  resetWalletUI();
}

  activeGame = "";

  $("searchInput").value = "";

  $("storeSection").classList.remove("hidden");

  renderStore();

}

function openGroup(group) {
  activeGroup = group;
  activeGame = "";
  viewMode = ["topups", "accounts", "skins"].includes(group)
    ? "games"
    : "products";

  $("searchInput").value = "";
  renderStore();
}

function openGame(group, game) {
  activeGroup = group;
  activeGame = game;
  viewMode = "products";
  renderStore();
}

function clearSearch() {
  $("searchInput").value = "";

  viewMode = activeGroup
    ? (
        ["topups", "accounts", "skins"].includes(activeGroup) && !activeGame
          ? "games"
          : "products"
      )
    : "home";

  renderStore();
}

function searchProducts() {
  viewMode = $("searchInput").value.trim()
    ? "search"
    : (
        activeGroup
          ? (
              ["topups", "accounts", "skins"].includes(activeGroup) && !activeGame
                ? "games"
                : "products"
            )
          : "home"
      );

  renderStore();
}

function breadcrumb() {
  let output =
    '<div class="breadcrumbs"><button class="nav" onclick="goHome()">Home</button>';

  const group = groups.find(item => item.id === activeGroup);

  if (group) {
    output += `<span>›</span><span>${escapeHTML(group.title)}</span>`;
  }

  if (activeGame) {
    output += `<span>›</span><span>${escapeHTML(activeGame)}</span>`;
  }

  return output + "</div>";
}

function renderHome() {
  return `
    <div class="section-heading"><h2>Explore the Vault</h2></div>
    <p class="muted">Choose a category to get started.</p>
    <div class="category-grid">
      ${groups.map(group => `
        <button class="category-card"
          onclick="openGroup('${group.id}')">
          <span class="category-icon">${group.icon}</span>
          <strong>${escapeHTML(group.title)}</strong>
          <small>${escapeHTML(group.desc)}</small>
        </button>
      `).join("")}
    </div>
    <div class="notice">💜 Browse by category or search for a product.</div>
  `;
}

function renderGames() {
  const list = activeGroup === "accounts"
    ? games
    : games.filter(game =>
        products.some(product =>
          product.group === activeGroup && product.game === game
        )
      );

  return `
    ${breadcrumb()}
    <h2>Choose a game</h2>
    <p class="muted">Select a game to browse listings.</p>
    <div class="game-grid">
      ${list.map(game => `
        <button class="game-card"
          onclick="openGame('${activeGroup}','${game}')">
          🎮 <strong>${escapeHTML(game)}</strong>
        </button>
      `).join("") || '<p class="muted">No products listed here yet.</p>'}
    </div>
  `;
}

function productCard(product) {
  const image = product.image
    ? `<img src="${escapeHTML(product.image)}"
         alt="${escapeHTML(product.name)}"
         loading="lazy"
         onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')">`
    : "";

  return `
    <article class="card">
      <div class="art">
        ${image}
        <span class="${product.image ? "hidden" : ""}">
          ${escapeHTML(product.icon)}
        </span>
        <small>GAMEVAULT</small>
      </div>
      <div class="info">
        <h3>${escapeHTML(product.name)}</h3>
        <p>
          ${escapeHTML(product.desc)} · ${escapeHTML(product.game)}
        </p>
        <button onclick="addToCart(${product.id})">Add to Cart</button>
      </div>
    </article>
  `;
}

function renderProducts() {
  const group = groups.find(item => item.id === activeGroup);

  let list = products.filter(product => product.group === activeGroup);

  if (activeGame) {
    list = list.filter(product => product.game === activeGame);
  }

  return `
    ${breadcrumb()}
    <h2>${escapeHTML(activeGame || group?.title || "Products")}</h2>
    <p class="muted">Browse available listings.</p>
    <div class="grid">
      ${list.map(productCard).join("") ||
        '<p class="muted">No products listed here yet.</p>'}
    </div>
  `;
}

function renderSearch() {
  const query = $("searchInput").value.trim().toLowerCase();

  const list = products.filter(product =>
    [
      product.name,
      product.game,
      product.group,
      product.desc,
      groups.find(group => group.id === product.group)?.title
    ].join(" ").toLowerCase().includes(query)
  );

  return `
    <h2>Search Results</h2>
    <p class="muted">${list.length} matching products.</p>
    <div class="grid">
      ${list.map(productCard).join("") ||
        '<p class="muted">No products found.</p>'}
    </div>
  `;
}

function renderStore() {
  $("storeView").innerHTML =
    viewMode === "home"
      ? renderHome()
      : viewMode === "games"
        ? renderGames()
        : viewMode === "search"
          ? renderSearch()
          : renderProducts();
}

function addToCart(id) {
  const product = products.find(item => item.id === id);
  if (!product) return;

  const existing = cart.find(item => item.id === id);

  if (existing) {
    existing.qty++;
  } else {
    cart.push({ ...product, qty: 1 });
  }

  $("cartCount").textContent =
    cart.reduce((total, item) => total + item.qty, 0);
}

function showCart() {
  $("storeSection").classList.add("hidden");
  $("cartSection").classList.remove("hidden");

  $("cartItems").innerHTML = cart.length
    ? cart.map(item => `
        <div class="line">
          <span>${escapeHTML(item.name)} × ${item.qty}</span>
          <button class="nav" onclick="removeFromCart(${item.id})">
            Remove one
          </button>
        </div>
      `).join("")
    : '<p class="muted">Your cart is empty.</p>';

  $("cartSection").scrollIntoView({ behavior: "smooth" });
}

function removeFromCart(id) {
  const item = cart.find(product => product.id === id);

  if (item) {
    item.qty--;

    if (item.qty <= 0) {
      cart = cart.filter(product => product.id !== id);
    }
  }

  $("cartCount").textContent =
    cart.reduce((total, product) => total + product.qty, 0);

  showCart();
}

/* Keep one modal listener. */
$("authModal").addEventListener("click", event => {
  if (event.target === $("authModal")) closeAuth();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeAuth();
});

addPasswordResetOption();
initializeSupabase();
renderStore();

/* Keep the Paystack reference until the signed-in user can verify it. */
(function handlePaystackReturn() {
  const params = new URLSearchParams(window.location.search);

  pendingPaymentReference =
    params.get("reference") || params.get("trxref");

  if (pendingPaymentReference) {
    $("walletSection").scrollIntoView({ behavior: "smooth" });

    if (currentUser) {
      verifyReturnedPayment();
    } else {
      setStatus(
        "walletMessage",
        "Log in to verify your payment and check your wallet."
      );
    }
  }
})();
